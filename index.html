<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Spring Flowers School</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

  <!-- My CSS -->
  <link rel="stylesheet" href="css/Mystyle.css">
</head>

<body>

  <div class="p-2" style="background-color:#0dcaf0">
    <img src="img/logof.jpg" height="50" width="80" alt="School Logo">
  </div>

  <header>
    <h3>Welcome to Spring Flowers School</h3>
  </header>

  <main class="container">
    <section class="pageHeading text-center mt-5 mb-4">
      <h2>Login</h2>
    </section>

    <section class="col-12 col-md-6 mx-auto profileBlock ProfileBorder p-5">
      <form class="text-center">
        <div class="mb-3">
          <label for="u1" class="form-label">Username</label>
          <input type="text" class="form-control" id="u1" onfocus="hideLoginError()">
        </div>

        <div class="mb-3">
          <label for="pass" class="form-label">Password</label>
          <input type="password" class="form-control" id="pass" onfocus="hideLoginError()">

          <input type="button" value="Submit" class="btn btnColor" onclick="Login()">
        </div>
      </form>
    </section>

    <section class="loginError text-center mt-3" id="loginError">
      Error!!!! you have entered Invalid User name or Password.
    </section>
  </main>

  <footer class="mt-5 position-absolute bottom-0">
    Created by Laxmi Satish, January 2023
  </footer>

  <!-- Bootstrap Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

  <!-- Project Script -->
  <script src="js/myScript.js"></script>

</body>
</html>
     <!--ProjectScript-->
     <script src="js/myScript.js"></script>

      </body>
      </html>
