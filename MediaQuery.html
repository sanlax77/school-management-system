<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Queries</title>

  <!-- Bootstrap CSS (needed for row / col-md-* classes) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

  <!-- My CSS -->
  <link rel="stylesheet" href="css/mediaquery.css">
</head>

<body>
  <div class="container">

    <!-- Two equal columns (50:50) from medium screens up -->
    <div class="row">
      <div class="col-md-6">Column left</div>
      <div class="col-md-6">Column right</div>
    </div>

    <!-- Columns with ratio 1:3 -->
    <div class="row">
      <div class="col-md-3">Column left</div>
      <div class="col-md-9">Column right</div>
    </div>

    <div class="text">Hello Screen</div>
    <div id="size"></div>

  </div>

  <script src="js/MediaQuery.js"></script>
</body>
</html>
