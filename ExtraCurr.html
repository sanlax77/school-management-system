
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Extra-Curricular Activities | Spring Flowers Public School</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

  <!-- My CSS -->
  <link rel="stylesheet" href="css/Mystyle.css">
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-info">
    <div class="container-fluid">
      <a class="navbar-brand" href="welcome.html">
        <img src="img/logof.jpg" height="50" width="80" alt="School Logo">
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
              aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="welcome.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="TimeTable.html">TimeTable</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="ExamResult.html">ExamResult</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="ExtraCurr.html">ExtraCurricular</a>
          </li>
        </ul>

        <ul class="navbar-nav">
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" id="StudentName"
               data-bs-toggle="dropdown" aria-expanded="false">
              Student
            </a>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="StudentName">
              <li><a class="dropdown-item" href="Sprofile.html">Profile</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="index.html" onclick="sessionStorage.clear()">Logout</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Header -->
  <header>
    <h3>Welcome to Spring Flowers School</h3>
  </header>

  <main class="container">

    <section class="pageHeading text-center mt-5 mb-4">
      <h2>Extra-Curricular Activities</h2>
    </section>

    <section class="col-12 col-md-6 mx-auto profileBlock ProfileBorder p-5">
      <form class="text-center" id="activityForm" onsubmit="return false;">

        <div class="input-group mb-3">
          <span class="input-group-text greenBg" id="name-label">Name</span>
          <input type="text" class="form-control" id="activityName"
                 aria-labelledby="name-label" placeholder="e.g. Football" required>
        </div>

        <div class="input-group mb-3">
          <span class="input-group-text greenBg" id="details-label">Details</span>
          <textarea id="activityDetails" class="form-control" rows="3"
                    aria-labelledby="details-label" placeholder="Describe the activity"></textarea>
        </div>

        <button type="button" class="btn btn-outline-primary" onclick="addActivity()">Submit</button>

      </form>
    </section>

  </main>

  <footer class="mt-5">
    Created by Laxmi Satish, January 2023
  </footer>

  <!-- Bootstrap Bundle (includes Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

  <!-- Project Script -->
  <script src="js/myScript.js"></script>
  <script>
    // Redirect to login if nobody is logged in
    if (!sessionStorage.getItem("StudId")) {
      window.location.href = "index.html";
    }

    // Show the logged-in student's name
    document.getElementById("StudentName").textContent = sessionStorage.getItem("username");
  </script>

</body>
</html>
